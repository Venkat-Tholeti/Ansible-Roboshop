---

 - name: Payment Component
   hosts: payment
   become: yes
   tasks:
      - name: Install python3 packages
        package:
           name: "{{ item }}"
           state: installed
        loop:
          - python3 
          - gcc 
          - python3-devel

      - name: System User Creation
        user:
          name: roboshop
          home: /app
          system: true
          shell: /sbin/nologin

      - name: Create App Directory
        file: 
          path: /app
          state: directory

      - name: Download payment code
        get_url:
           url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip 
           dest: /tmp/payment.zip

      - name: Extract payment code
        unarchive:
           src: /tmp/payment.zip
           dest: /app
           remote_src: yes
     # remote_src :no (default): file is copied from controller then extracted
     # remote_src:yes : file already exists on remote host

      - name: install dependencies
        package:
          requirements: requirements.txt
          executable: pip3.9
        args:
         chdir: /app

      - name: copy payment service
        copy:
          src: payment.service
          dest: /etc/systemd/system/payment.service
        notify: Reload systemd


      - name: enable and start payment
        service:
          name: payment
          state: started
          enabled: yes

   handlers:
     - name: Reload systemd
       systemd:
            daemon_reload: true