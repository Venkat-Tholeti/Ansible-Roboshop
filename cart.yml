---
  - name: Configuring cart Component
    hosts: cart
    become: yes
    tasks:
      - name: Disable default nodejs
        command: # there is no module for disabling specific version so we are going with command module
          dnf module disable nodejs -y

      - name: Enable nodejs:20
        command: # there is no module for enabling specific version so we are going with command module
            dnf module enable nodejs:20 -y

      - name: Install nodejs
        package:
          name: nodejs
          state: present

      - name: Creating System User
        cart:
           name: roboshop
           shell: /sbin/nologin
           system: true #for system cart
           home: /app

      - name: Create App Directory
        file: 
          path: /app
          state: directory

      - name: Download cart code
        get_url:
           url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip 
           dest: /tmp/cart.zip

      - name: Extract cart code
        unarchive:
           src: /tmp/cart.zip
           dest: /app
           remote_src: yes
     # remote_src :no (default): file is copied from controller then extracted
     # remote_src:yes : file already exists on remote host
          
      - name: Install Dependencies
        community.general.npm:
             path: /app

      - name: Copy cart service to system directory
        copy:
          src: cart.service
          dest: /etc/systemd/system/cart.service
        notify: Reload systemd

      - name: Start & Enable cart Service
        service:
            name: cart
            state: started
            enabled: yes


    handlers:
        - name: Reload systemd
          systemd:
            daemon_reload: true

          