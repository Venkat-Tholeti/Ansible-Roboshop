---

- name: Configuring MongoDb server
  hosts: mongodb
  become: yes
  tasks:
    - name: Copy mongodb repo
      copy:
        src: mongodb.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name: Install Mongodb package
      package:
         name: mongodb-org
         state: present

    - name: Starting and  Enabling the service
      service:
         name: mongod
         state: started
         enabled: yes

