---
  - name: Configuring MongoDb server
    hosts: mongodb 
    become: yes
    tasks:
       - name: copy mongo repo to Mongodb server
         copy:
            src: mongo.repo
            dest: /etc/yum.repos.d/mongo.repo
       
       - name: Install mongodb 
         package:
            name: mongodb-org
            state: present

       - name: Start & Enable MongoDB Service
         service:
             name: mongod
             state: started
             enabled: yes